<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matera Inteligente</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container glassmorphism">
        <h1>🌱 Matera Inteligente</h1>
        
        <!-- Formulario que NO recarga la página -->
        <form id="materaForm">
            <div class="input-group">
                <label>Especie:</label>
                <select id="especie" required>
                    <option value="Orquidea">Orquídea</option>
                    <option value="Cactus">Cactus</option>
                    <option value="Helecho">Helecho</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Humedad (%):</label>
                <input type="number" id="humedad" step="0.1" required>
            </div>

            <div class="input-group">
                <label>Luz (lux):</label>
                <input type="number" id="luz" step="0.1" required>
            </div>

            <div class="input-group">
                <label>Temperatura (°C):</label>
                <input type="number" id="temperatura" step="0.1" required>
            </div>

            <button type="submit">Analizar Salud</button>
        </form>

        <!-- Aquí inyectaremos los resultados con JavaScript -->
        <div id="resultado" class="oculto">
            <h2 id="res-nivel"></h2>
            <p id="res-mensaje"></p>
            <div class="vitalidad-bar-container">
                <div id="res-barra" class="vitalidad-bar"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
